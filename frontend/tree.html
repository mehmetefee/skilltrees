<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skill Tree</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
<script src="/theme.js"></script>
<link rel="stylesheet" href="/vendor/katex/katex.min.css" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="tree-fullscreen-wrap" id="graph-wrap">
    <!-- Top-left info overlay -->
    <div class="tree-overlay-topleft">
      <a class="back-link" href="/#browse">&larr; All trees</a>
      <input id="tree-title" class="inline-title" type="text" maxlength="120"
        placeholder="Untitled skill tree" autocomplete="off" />
      <textarea id="tree-desc" class="inline-desc" maxlength="1000" rows="1"
        placeholder="Add a description&hellip;"></textarea>
      <p class="meta">
        <span id="tree-meta-count"></span>
        by <input id="tree-author" class="inline-author" type="text" maxlength="80"
          placeholder="Anonymous" autocomplete="off" />
        <span id="tree-meta-time"></span>
        <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
      </p>
      <p class="hint-bar" id="toolbar-hint">Click a skill to see details. Drag to reposition.</p>
    </div>

    <!-- Top-right toolbar & controls -->
    <div class="tree-overlay-topright">
      <button class="btn" id="add-skill-btn">+ Add skill</button>
      <button class="btn" id="link-mode-btn">Link prerequisite</button>
      <button class="btn" id="export-btn" title="Download this tree as a JSON file">Export</button>
      <button class="btn btn-danger" id="delete-tree-btn">Delete tree</button>
      <span class="auth-slot"></span>
    </div>

    <!-- Zoom controls -->
    <div class="zoom-controls" role="group" aria-label="Zoom controls">
      <button class="btn btn-small" id="zoom-in-btn" title="Zoom in" aria-label="Zoom in">+</button>
      <button class="btn btn-small" id="zoom-out-btn" title="Zoom out" aria-label="Zoom out">&minus;</button>
      <button class="btn btn-small" id="zoom-fit-btn" title="Fit to screen" aria-label="Fit graph to screen">Fit</button>
    </div>

    <!-- Graph SVG -->
    <svg id="graph-svg" width="100%" height="100%">
      <defs>
        <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0.5, 6.5 3.5, 0 6.5" fill="var(--locked)"></polygon>
        </marker>
        <marker id="arrowhead-accent" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0.5, 6.5 3.5, 0 6.5" fill="var(--accent)"></polygon>
        </marker>
        <marker id="arrowhead-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0.5, 6.5 3.5, 0 6.5" fill="#10b981"></polygon>
        </marker>
      </defs>
      <g id="edges-layer"></g>
      <g id="nodes-layer"></g>
    </svg>

    <!-- Bottom legend -->
    <div class="legend">
      <span><span class="swatch locked"></span>Has prerequisites</span>
      <span><span class="swatch unlocked"></span>Start here (no prerequisites)</span>
    </div>

  </div>

  <!-- Side panel: skill details -->
  <div class="side-panel" id="side-panel">
    <button class="close-btn" id="panel-close" aria-label="Close details panel">&times;</button>
    <h2 id="panel-name"></h2>
    <p id="panel-desc" style="color: var(--text-muted); font-size: 14px;"></p>

    <div class="panel-section">
      <h3>Requires</h3>
      <ul class="prereq-list" id="panel-prereqs"></ul>
    </div>
    <div class="panel-section">
      <h3>Unlocks</h3>
      <ul class="unlock-list" id="panel-unlocks"></ul>
    </div>
    <div class="panel-section">
      <button class="btn btn-danger btn-small" id="panel-delete-btn">Delete this skill</button>
    </div>
  </div>

  <!-- Export modal -->
  <div class="modal-overlay" id="export-overlay" hidden>
    <div class="modal">
      <h2>Export this tree</h2>
      <p class="modal-subtitle">
        How should the file describe the layout?
      </p>
      <form id="export-form">
        <label class="choice">
          <input type="radio" name="export-layout" value="manual" checked />
          <span>
            <strong>Keep this arrangement</strong>
            <em>Saves where the skills currently sit, including anything you've
            dragged. Anyone importing the file sees exactly this layout.</em>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="export-layout" value="auto" />
          <span>
            <strong>Arrange automatically</strong>
            <em>Saves no positions at all. The tree is laid out from its
            structure wherever it's opened, and stays tidy as it's edited.</em>
          </span>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn" id="export-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="export-submit-btn">Export</button>
        </div>
      </form>
    </div>
  </div>

  <!-- New skill modal -->
  <div class="modal-overlay" id="skill-modal-overlay" hidden>
    <div class="modal">
      <h2>Add a skill</h2>
      <p class="modal-subtitle">
        Define a new skill node to add to this tree.
      </p>
      <form id="new-skill-form">
        <div class="field">
          <label for="skill-name">Skill name</label>
          <input id="skill-name" type="text" maxlength="120" required placeholder="e.g. Knead dough" />
        </div>
        <div class="field">
          <label for="skill-desc">Description (optional)</label>
          <textarea id="skill-desc" maxlength="1000" placeholder="What does learning this involve?"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="skill-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Add skill</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/layout.js"></script>
  <script src="/app.js"></script>
  <script src="/tree.js"></script>
</body>
</html>
