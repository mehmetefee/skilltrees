<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Skill Trees</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <a class="back-link" href="/#browse">&larr; All trees</a>

    <div class="page-header">
      <div>
        <h1 id="auth-heading">Sign in</h1>
        <p id="auth-intro">Trees can be browsed by anyone, but only the account that made a tree can change it.</p>
      </div>
    </div>

    <!-- Why a sign-in through another provider didn't finish (?oauth_error=).
         Filled from a fixed list with textContent: nothing the provider or the
         URL says is ever rendered as markup. -->
    <div id="oauth-error" class="import-problems account-notice" role="alert" hidden></div>

    <!-- Signed out: a button per configured provider, then the password form.
         Both views start hidden; app.js shows the right one once it knows
         whether anyone is signed in, so neither flashes up for the wrong person. -->
    <div class="auth-card" id="sign-in-view" hidden>
      <div id="oauth-providers" class="oauth-providers" hidden></div>
      <div id="oauth-divider" class="auth-divider" hidden><span>or</span></div>

      <form id="auth-form">
        <div class="field">
          <label for="auth-username">Username</label>
          <input id="auth-username" type="text" maxlength="40" required autocomplete="username"
            autofocus placeholder="letters, numbers, dash or underscore" />
        </div>
        <div class="field">
          <label for="auth-password">Password</label>
          <input id="auth-password" type="password" maxlength="200" required
            autocomplete="current-password" placeholder="at least 8 characters" />
        </div>
        <div id="auth-error" class="import-problems" hidden></div>
        <div class="auth-actions">
          <button type="submit" class="btn btn-primary" id="auth-submit">Sign in</button>
          <button type="button" class="btn" id="auth-toggle">Create an account instead</button>
        </div>
      </form>
    </div>

    <!-- Signed in: "Your account".
         Each <section class="account-section"> is one self-contained panel with
         its own heading, and owns everything inside it. New panels go in as
         further sections inside #account-view, in the order they should
         appear — the two marked below are where they are expected. -->
    <div id="account-view" class="account-view" hidden>
      <section class="account-section" id="account-overview" aria-labelledby="account-username">
        <div class="account-overview">
          <span class="user-avatar account-avatar" id="account-avatar" aria-hidden="true"></span>
          <div class="account-overview-text">
            <h2 id="account-username" class="account-username"></h2>
            <p class="account-section-intro">Only this account can change the trees it made.</p>
          </div>
          <button type="button" class="btn" id="account-sign-out">Sign out</button>
        </div>
      </section>

      <section class="account-section" id="account-sign-in-methods" aria-labelledby="sign-in-methods-heading">
        <h2 id="sign-in-methods-heading">Sign-in methods</h2>
        <p class="account-section-intro">The ways you can get back into this account. Keep at least one.</p>
        <ul class="sign-in-methods" id="sign-in-methods-list"></ul>
        <div id="sign-in-methods-error" class="import-problems" role="alert" hidden></div>
      </section>

      <!-- Passkeys: a section of its own goes here. -->

      <!-- Change password, sessions and deleting the account: a section of its own goes here. -->
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
